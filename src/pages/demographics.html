<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NIH-MERGE – Demographics</title>
    <link rel="stylesheet" href="/src/style/index.scss" />
  </head>
  <body>

    <!-- include:header demographics -->

    <!-- Main content -->
    <main id="main-content" class="main-content padding-y-3">
      <div class="grid-container">
        <div class="grid-row">
          <!-- Sidebar -->
          <div class="grid-col-auto display-flex flex-column width-card-lg">
            <div class="usa-form-group">
              <h2 class="nci-heading-h2 margin-top-4">Data Options</h2>

              <h3 class="nci-heading-h3 margin-top-2">Compare</h3>

              <label class="usa-label text-bold usa-label-short-margin" for="select-compare-bar">Within Plot</label>
              <select class="usa-select" name="select-compare-bar" id="select-compare-bar" disabled></select>

              <label class="usa-label text-bold usa-label-short-margin" for="select-compare-facet">Between Plot</label>
              <select class="usa-select" name="select-compare-facet" id="select-compare-facet" disabled></select>

              <h3 class="nci-heading-h3">Select</h3>

              <label class="usa-label text-bold usa-label-short-margin" for="select-select-year">Year</label>
              <select class="usa-select" name="select-select-year" id="select-select-year" disabled></select>

              <label class="usa-label text-bold usa-label-short-margin" for="select-select-state">US State</label>
              <div id="combo-select-state" class="usa-combo-box">
                <select class="usa-select" name="select-select-state" id="select-select-state" disabled></select>
              </div>

              <label class="usa-label text-bold usa-label-short-margin" for="select-select-cause">Cancer Site</label>
              <div id="combo-select-cause" class="usa-combo-box">
                <select class="usa-select" name="select-select-cause" id="select-select-cause" disabled></select>
              </div>

              <label class="usa-label text-bold usa-label-short-margin" for="select-select-sex">Sex</label>
              <select class="usa-select" name="select-select-sex" id="select-select-sex" disabled></select>

              <label class="usa-label text-bold usa-label-short-margin" for="select-select-race">Race/Ethnicity</label>
              <select class="usa-select" name="select-select-race" id="select-select-race" disabled></select>

              <label class="usa-label text-bold usa-label-short-margin" for="select-select-age">Age Group</label>
              <select class="usa-select" name="select-select-age" id="select-select-age" disabled></select>

              <h3 class="nci-heading-h3">Other</h3>

              <label class="usa-label text-bold usa-label-short-margin" for="select-measure">Measure</label>
              <select class="usa-select" name="select-measure" id="select-measure" disabled></select>
            </div>
          </div>

          <!-- Main area -->
          <div class="grid-col-fill display-flex flex-column padding-left-5 padding-right-0">
            <h1 class="margin-0">Demographics</h1>
            <p class="font-serif-sm">Configurable bar charts showing cancer mortality rates (crude or age-adjusted) optionally stratified by age group, race, and sex.</p>

            <div class="epi-top-controls">
              <button id="btn-filter" class="epi-icon-btn" type="button" title="Filter">
                <i class="fa-solid fa-filter"></i>
              </button>
              <button id="btn-settings" class="epi-icon-btn" type="button" title="Graph Settings">
                <i class="fa-solid fa-gear"></i>
              </button>
              <button id="btn-table" class="epi-icon-btn" type="button" title="Data Table">
                <i class="fa-solid fa-table"></i>
              </button>
              <button id="btn-download" class="epi-icon-btn" type="button" title="Download">
                <i class="fa-solid fa-download"></i>
              </button>
            </div>

            <div id="plot-container-container" class="margin-x-0 margin-y-1 height-full display-flex flex-justify-center">
              <div id="plot-container" style="display: grid; grid-template-rows: auto 1fr; width: 100%;">
                <h3 id="title" class="margin-0 padding-top-2 padding-x-3 text-center"></h3>
                <div id="plot" style="overflow-x: auto; overflow-y: hidden;" aria-busy="true">
                  <div class="epi-plot-loading" role="status">Loading plot data</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- include:footer -->

    <!-- Hidden containers for plot filter checkboxes (shown in tooltips later) -->
    <div style="display: none;">
      <div id="filter-compare-bar"></div>
      <div id="filter-compare-facet"></div>
    </div>

    <script type="module" src="/src/core/demographics/main.ts"></script>
  </body>
</html>
