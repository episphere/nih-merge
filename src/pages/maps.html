<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NIH-MERGE – Maps</title>
    <link rel="stylesheet" href="/src/style/index.scss" />
  </head>
  <body>

    <!-- include:header maps -->

    <!-- Main content -->
    <main id="main-content" class="main-content">
      <div class="grid-container padding-top-3">
        <div class="grid-row display-flex flex-column">
          <h1 class="margin-0">Interactive Map Dashboard</h1>
          <p class="font-serif-sm maps-intro">Compare cancer mortality, population, and county characteristics side by side.
            Add a map or clone an existing one, then choose independent or shared color scales from each legend’s settings.</p>
        </div>
      </div>

      <div id="dashboard" class="margin-x-3 margin-top-0 margin-bottom-1">
        <!-- Dashboard actions -->
        <div id="dashboard-topbar" class="display-flex flex-justify-end flex-align-center">
          <div class="epi-top-controls">
            <button id="btn-edit-grid" class="epi-icon-btn" type="button" title="Edit Grid" aria-label="Edit grid">
              <i class="fa-solid fa-plus"></i>
            </button>
            <button id="btn-settings" class="epi-icon-btn" type="button" title="Dashboard appearance" aria-label="Dashboard appearance">
              <i class="fa-solid fa-gear"></i>
            </button>
            <button id="btn-table" class="epi-icon-btn" type="button" title="Data Table" aria-label="Open map data table">
              <i class="fa-solid fa-table"></i>
            </button>
            <button id="btn-download" class="epi-icon-btn" type="button" title="Download" aria-label="Download maps or data">
              <i class="fa-solid fa-download"></i>
            </button>
          </div>
        </div>

        <!-- Map grid container (Gridette attaches here) -->
        <div id="map-grid"></div>
      </div>
    </main>

    <!-- include:footer -->

    <script type="module" src="/src/core/maps/main.ts"></script>
  </body>
</html>
